[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cmcserver"
description = "Helper tools for managing my Minecraft server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "mctools",
    "tomlkit",
    "boto3"
]
dynamic = ["version"]

[project.scripts]
cmcserver = "cmcserver.main:cli"

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "coverage",
    "commitizen",
]

[tool.setuptools_scm]
write_to = "src/cmcserver/_version.py"

[tool.commitizen]
name = "cz_conventional_commits"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["src/cmcserver/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "I"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["cmcserver"]
