[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cmcserver"
description = "Helper tools for managing my Minecraft server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "coverage",
    "commitizen",
]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.coverage.run]
branch = true
source = ["cmcserver"]
omit = ["src/cmcserver/_version.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["src/cmcserver/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "I"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["cmcserver"]
